name: Collect

# Step 1, COLLECT: get new items from every source and commit them to data/.
# No model runs here, and with no enabled source in config.json the job does nothing.

on:
  schedule:
    # 05:17 UTC every day. Cron is in UTC, and scheduled runs can start late,
    # so the agent also starts this workflow itself (see PLAYBOOK.md, step 1).
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Run one source id only (to debug). Leave empty for all sources."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect new items
        env:
          SOURCE: ${{ github.event.inputs.source }}
          # A source that needs a key reads it from here. Add the secret in
          # Settings -> Secrets and variables -> Actions, then pass it on like this:
          # EXAMPLE_API_KEY: ${{ secrets.EXAMPLE_API_KEY }}
        run: |
          if [ -n "$SOURCE" ]; then
            python collect.py --source "$SOURCE"
          else
            python collect.py
          fi

      - name: Commit new data
        run: |
          [ -d data ] || { echo "No data yet"; exit 0; }
          git config user.name "collect[bot]"
          git config user.email "collect@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Collect $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
